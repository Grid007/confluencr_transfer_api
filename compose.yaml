services:
  db:
    image: postgres:17.11-alpine
    environment: { POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger, POSTGRES_DB: ledger }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ledger -d ledger']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s
  migrate:
    profiles: [full]
    build: .
    command: ['node', 'dist/cli/migrate.js']
    environment: { DATABASE_URL: 'postgres://ledger:ledger@db:5432/ledger' }
    depends_on: { db: { condition: service_healthy } }
  api:
    profiles: [full]
    build: .
    init: true
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: info
      DATABASE_URL: 'postgres://ledger:ledger@db:5432/ledger'
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
